type: image
split: val
root: /path/to/data  # put your videos in root/hodome_test/img.jpg
video_dir: hodome_test
seq: basketball 
ext: jpg
src_path: ${data.root}/${data.video_dir}/${data.seq}/${data.seq}.${data.ext}
# frame_opts:
#   ext: jpg
#   fps: 25
#   start_sec: 0
#   end_sec: -1
use_cams: True
# track_ids: "all"
track_ids: "001"
# track_ids: "002"
# track_ids: "003"
shot_idx: 0
start_idx: 0
end_idx: 2
split_cameras: True
name: ${data.seq}-${data.track_ids}-shot-${data.shot_idx}-${data.start_idx}-${data.end_idx}
sources:
  images: ${data.root}/hodome_test/${data.seq}
  cameras: ${data.root}/milo/cameras/${data.seq}/shot-${data.shot_idx}
  tracks: ${data.root}/milo/track_preds/${data.seq}
  shots: ${data.root}/milo/shot_idcs/${data.seq}.json
